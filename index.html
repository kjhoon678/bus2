<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>부산 77번 양자 익스프레스 (Quantum Bus 77)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background: #161b22;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,255,200,0.15);
            border: 2px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
        }
        #canvas-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(13, 17, 23, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 20;
            text-align: center;
        }
        .hidden { display: none !important; }
        
        h1 { font-size: 1.8rem; color: #58a6ff; margin-bottom: 8px; text-shadow: 0 0 10px rgba(88,166,255,0.4); }
        p { font-size: 0.95rem; color: #8b949e; margin-bottom: 20px; line-height: 1.4; }
        
        input[type="text"] {
            width: 80%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #30363d;
            background: #0d1117;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #58a6ff; }
        
        button.btn {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46,160,67,0.3);
            transition: transform 0.1s;
        }
        button.btn:active { transform: scale(0.96); }

        .quiz-card {
            background: #161b22;
            border: 2px solid #58a6ff;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 0 20px rgba(88,166,255,0.2);
        }
        .quiz-question {
            font-size: 1.05rem;
            color: #f0f6fc;
            margin-bottom: 16px;
            font-weight: bold;
            line-height: 1.4;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .quiz-opt-btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .quiz-opt-btn:hover { background: #30363d; color: #fff; }

        .reward-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .reward-card {
            background: #21262d;
            border: 1px solid #388bfd;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }
        .reward-card:hover { background: #30363d; }
        .reward-title { font-weight: bold; color: #58a6ff; font-size: 0.95rem; }
        .reward-desc { font-size: 0.8rem; color: #8b949e; margin-top: 4px; }

        #controls-panel {
            height: 160px;
            background: #0d1117;
            border-top: 2px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            gap: 10px;
        }
        .dpad-container {
            display: flex;
            gap: 10px;
        }
        .ctrl-btn {
            background: #21262d;
            border: 2px solid #30363d;
            color: #f0f6fc;
            font-weight: bold;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .ctrl-btn:active { background: #30363d; }
        .ctrl-btn-nav { width: 68px; height: 68px; font-size: 1.5rem; }
        .action-container { display: flex; gap: 10px; }
        .ctrl-btn-action {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            font-size: 0.85rem;
            flex-direction: column;
        }
        .btn-polarity { border-color: #a371f7; color: #d2a8ff; background: #261738; }
        .btn-attack { border-color: #f85149; color: #ff7b72; background: #3c1e1e; }
        
        .leaderboard-list {
            width: 100%;
            max-height: 160px;
            overflow-y: auto;
            margin: 10px 0;
            background: #161b22;
            border-radius: 6px;
            padding: 8px;
        }
        .lb-row { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 0.85rem; border-bottom: 1px solid #21262d; }
        .lb-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
        
        <!-- START SCREEN -->
        <div id="start-screen" class="overlay">
            <h1>🚌 부산 77번 양자 익스프레스</h1>
            <p>전자기와 양자 물리 장벽을 뚫고 달리는<br>부산 친환경 고속 버스!</p>
            <input type="text" id="player-name" placeholder="드라이버 이름 입력" maxlength="8" value="부산기사">
            <button class="btn" onclick="startGame()">양자 운행 시작</button>
            <div class="leaderboard-list" id="start-lb"></div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="overlay hidden">
            <div class="quiz-card">
                <div style="color: #79c0ff; font-size: 0.8rem; margin-bottom: 6px;">⚡ 양자 전자기 정비소 (1000m 도달)</div>
                <div id="quiz-q" class="quiz-question">질문 내용</div>
                <div id="quiz-opts" class="quiz-options"></div>
            </div>
        </div>

        <!-- REWARD SCREEN -->
        <div id="reward-screen" class="overlay hidden">
            <h2 style="color: #3fb950; margin-bottom: 12px;">✅ 정답입니다! 연구 지원 버프 선택</h2>
            <div id="reward-options" class="reward-grid"></div>
        </div>

        <!-- GAME OVER SCREEN -->
        <div id="gameover-screen" class="overlay hidden">
            <h1 style="color: #f85149;">운행 종료</h1>
            <p id="gameover-stats">기록: 0m | 점수: 0점</p>
            <div class="leaderboard-list" id="end-lb"></div>
            <button class="btn" onclick="restartGame()">재운행 시작</button>
        </div>
    </div>

    <!-- CONTROLS PANEL -->
    <div id="controls-panel">
        <div class="dpad-container">
            <div class="ctrl-btn ctrl-btn-nav" id="btn-left">◀</div>
            <div class="ctrl-btn ctrl-btn-nav" id="btn-right">▶</div>
        </div>
        <div class="action-container">
            <div class="ctrl-btn ctrl-btn-action btn-polarity" id="btn-polarity">
                <span>🧲</span>
                <span style="font-size:0.75rem;">극성</span>
            </div>
            <div class="ctrl-btn ctrl-btn-action btn-attack" id="btn-attack">
                <span>⚡</span>
                <span style="font-size:0.75rem;">공격</span>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');

function resizeCanvas() {
    canvas.width = wrapper.clientWidth;
    canvas.height = wrapper.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'destroy') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.3);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
    } else if (type === 'switch') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    }
}

let gameState = 'START';
let playerName = '부산기사';
let score = 0;
let distance = 0;
let nextQuizDistance = 1000;
let nextMapDistance = 2000;

let currentLanes = 5;
let baseSpeed = 3.5;
let speedMultiplier = 1.0;

let bus = {
    lane: 2,
    targetX: 0,
    x: 0,
    y: 0,
    width: 36,
    height: 70,
    hp: 3,
    maxHp: 3,
    charge: 1,
    attackDamage: 1,
    attackCooldown: 0,
    maxCooldown: 15,
    invincibleTimer: 0
};

let bullets = [];
let obstacles = [];
let particles = [];

const quizBank = [
    { q: "전하량이 같은 두 양전하(+) 사이에서 작용하는 전자기력의 특성은?", opts: ["서로 끌어당긴다 (인력)", "서로 밀어낸다 (척력)", "전자기력이 0이 된다", "질량이 증가한다"], ans: 1 },
    { q: "빛과 전자가 입자성과 파동성을 모두 가지는 원리를 무엇이라 하는가?", opts: ["빛의 전반사", "양자 이중성", "상대성 이론", "열역학 제2법칙"], ans: 1 },
    { q: "초전도체가 자석 위에 붕 떠오르는 완전 반자성 현상의 이름은?", opts: ["마이스너 효과", "도플러 효과", "광전 효과", "콤프턴 효과"], ans: 0 },
    { q: "양자역학에서 입자의 위치와 운동량을 동시에 정확히 측정할 수 없다는 원리는?", opts: ["파울리 배타 원리", "하이젠베르크 불확정성 원리", "슈뢰딩거 파동 방정식", "맥스웰 방정식"], ans: 1 },
    { q: "전기장과 자기장의 상호작용을 통합한 4개의 방정식 이름은?", opts: ["뉴턴 운동 방정식", "맥스웰 방정식", "아인슈타인장 방정식", "오옴의 법칙"], ans: 1 }
];

const themes = [
    { name: "부산 그린 에코 도로", sky: "#87CEEB", grass: "#2d8a4e", road: "#3a3d40", line: "#ffffff" },
    { name: "광안해변 노을 해안로", sky: "#ff7e5f", grass: "#b85d19", road: "#2c3038", line: "#ffeb3b" },
    { name: "양자 사이버 네온 고속도로", sky: "#0f0c29", grass: "#24243e", road: "#141e30", line: "#00e5ff" },
    { name: "심우주 하이퍼 차원로", sky: "#000000", grass: "#1a0033", road: "#0d0d1a", line: "#ff007f" }
];
let currentThemeIdx = 0;

function initGame() {
    score = 0;
    distance = 0;
    nextQuizDistance = 1000;
    nextMapDistance = 2000;
    currentLanes = 5;
    speedMultiplier = 1.0;
    currentThemeIdx = 0;

    bus.maxHp = 3;
    bus.hp = 3;
    bus.attackDamage = 1;
    bus.maxCooldown = 15;
    bus.lane = Math.floor(currentLanes / 2);
    bus.charge = 1;
    bus.invincibleTimer = 0;

    bullets = [];
    obstacles = [];
    particles = [];

    updateBusPosition(true);
}

function updateBusPosition(immediate = false) {
    const laneWidth = canvas.width / currentLanes;
    bus.targetX = bus.lane * laneWidth + (laneWidth - bus.width) / 2;
    bus.y = canvas.height - 110;
    if (immediate) bus.x = bus.targetX;
}

function moveLeft() {
    if (gameState !== 'PLAYING') return;
    if (bus.lane > 0) {
        bus.lane--;
        updateBusPosition();
    }
}

function moveRight() {
    if (gameState !== 'PLAYING') return;
    if (bus.lane < currentLanes - 1) {
        bus.lane++;
        updateBusPosition();
    }
}

function togglePolarity() {
    if (gameState !== 'PLAYING') return;
    bus.charge *= -1;
    playSound('switch');
    createParticles(bus.x + bus.width / 2, bus.y + bus.height / 2, bus.charge === 1 ? '#ff4d4d' : '#3399ff', 10);
}

function shoot() {
    if (gameState !== 'PLAYING') return;
    if (bus.attackCooldown <= 0) {
        bullets.push({
            x: bus.x + bus.width / 2 - 4,
            y: bus.y,
            width: 8,
            height: 16,
            speed: 12
        });
        bus.attackCooldown = bus.maxCooldown;
        playSound('shoot');
    }
}

window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
    if (e.key === 'Shift' || e.key === 'q' || e.key === 'Q') togglePolarity();
    if (e.key === ' ' || e.key === 'f' || e.key === 'F') shoot();
});

function bindTouch(id, fn) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); fn(); });
    el.addEventListener('mousedown', (e) => { e.preventDefault(); fn(); });
}
bindTouch('btn-left', moveLeft);
bindTouch('btn-right', moveRight);
bindTouch('btn-polarity', togglePolarity);
bindTouch('btn-attack', shoot);

function spawnObstacle() {
    const laneWidth = canvas.width / currentLanes;
    const lane = Math.floor(Math.random() * currentLanes);
    
    const typeRand = Math.random();
    let type = 0;
    if (typeRand < 0.35) type = 0;
    else if (typeRand < 0.70) type = 1;
    else if (typeRand < 0.85) type = 2;
    else type = 3;

    obstacles.push({
        lane: lane,
        x: lane * laneWidth + (laneWidth - 32) / 2,
        y: -60,
        width: 32,
        height: 32,
        hp: 4,
        maxHp: 4,
        type: type,
        phase: 0,
        speed: (2.0 + Math.random() * 1.5) * speedMultiplier
    });
}

function createParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 20,
            maxLife: 20,
            color: color
        });
    }
}

let lastTime = performance.now();

function gameLoop(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (gameState === 'PLAYING') {
        updateGame(dt);
    }
    renderGame();
    requestAnimationFrame(gameLoop);
}

function updateGame(dt) {
    const currentSpeed = baseSpeed * speedMultiplier;
    distance += currentSpeed * 0.15;
    score += Math.floor(currentSpeed);
    
    speedMultiplier = 1.0 + Math.floor(distance / 500) * 0.25;

    if (distance >= nextQuizDistance) {
        nextQuizDistance += 1000;
        triggerQuiz();
        return;
    }

    if (distance >= nextMapDistance) {
        nextMapDistance += 2000;
        currentLanes = Math.min(currentLanes + 1, 8);
        currentThemeIdx = (currentThemeIdx + 1) % themes.length;
        updateBusPosition(true);
    }

    bus.x += (bus.targetX - bus.x) * 0.25;
    if (bus.attackCooldown > 0) bus.attackCooldown--;
    if (bus.invincibleTimer > 0) bus.invincibleTimer--;

    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < -20) bullets.splice(i, 1);
    }

    if (Math.random() < 0.03 + (currentLanes * 0.003)) {
        spawnObstacle();
    }

    const laneWidth = canvas.width / currentLanes;
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += obs.speed * speedMultiplier;

        if (obs.type === 0 || obs.type === 1) {
            const obsCharge = obs.type === 0 ? 1 : -1;
            const diffX = (bus.x + bus.width / 2) - (obs.x + obs.width / 2);
            
            if (bus.charge !== obsCharge) {
                obs.x += Math.sign(diffX) * 0.8;
            } else {
                obs.x -= Math.sign(diffX) * 0.5;
            }
        }

        if (obs.type === 2) {
            obs.phase += 0.05;
        } else if (obs.type === 3) {
            if (Math.random() < 0.02) {
                obs.lane = Math.floor(Math.random() * currentLanes);
                obs.x = obs.lane * laneWidth + (laneWidth - 32) / 2;
            }
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (b.x < obs.x + obs.width && b.x + b.width > obs.x &&
                b.y < obs.y + obs.height && b.y + b.height > obs.y) {
                
                if (obs.type === 2 && Math.sin(obs.phase) < -0.3) continue;

                bullets.splice(j, 1);
                obs.hp -= bus.attackDamage;
                playSound('hit');
                createParticles(obs.x + obs.width / 2, obs.y + obs.height / 2, '#ffcc00', 5);

                if (obs.hp <= 0) {
                    createParticles(obs.x + obs.width / 2, obs.y + obs.height / 2, '#ff3300', 15);
                    playSound('destroy');
                    obstacles.splice(i, 1);
                    score += 50;
                    break;
                }
            }
        }

        if (obstacles[i] && bus.invincibleTimer <= 0) {
            if (bus.x < obs.x + obs.width && bus.x + bus.width > obs.x &&
                bus.y < obs.y + obs.height && bus.y + bus.height > obs.y) {
                
                if (!(obs.type === 2 && Math.sin(obs.phase) < -0.3)) {
                    bus.hp--;
                    bus.invincibleTimer = 60;
                    playSound('hit');
                    createParticles(bus.x + bus.width / 2, bus.y + bus.height / 2, '#ff0000', 20);
                    obstacles.splice(i, 1);

                    if (bus.hp <= 0) {
                        gameOver();
                    }
                }
            }
        }

        if (obstacles[i] && obstacles[i].y > canvas.height + 50) {
            obstacles.splice(i, 1);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function renderGame() {
    const theme = themes[currentThemeIdx];

    ctx.fillStyle = theme.sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const roadPadding = 24;
    const roadWidth = canvas.width - roadPadding * 2;
    ctx.fillStyle = theme.road;
    ctx.fillRect(roadPadding, 0, roadWidth, canvas.height);

    ctx.fillStyle = theme.grass;
    ctx.fillRect(0, 0, roadPadding, canvas.height);
    ctx.fillRect(canvas.width - roadPadding, 0, roadPadding, canvas.height);

    const treeOffsetY = (distance * 5) % 80;
    ctx.fillStyle = '#1b5e20';
    for (let y = -80 + treeOffsetY; y < canvas.height; y += 80) {
        ctx.beginPath();
        ctx.arc(12, y, 10, 0, Math.PI * 2);
        ctx.arc(canvas.width - 12, y, 10, 0, Math.PI * 2);
        ctx.fill();
    }

    const laneWidth = roadWidth / currentLanes;
    ctx.strokeStyle = theme.line;
    ctx.lineWidth = 2;
    ctx.setLineDash([16, 16]);
    ctx.lineDashOffset = -(distance * 8) % 32;

    for (let i = 1; i < currentLanes; i++) {
        const lx = roadPadding + i * laneWidth;
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, canvas.height);
        ctx.stroke();
    }
    ctx.setLineDash([]);

    if (gameState === 'PLAYING' || gameState === 'QUIZ' || gameState === 'REWARD') {
        ctx.fillStyle = '#00ffff';
        for (let b of bullets) {
            ctx.fillRect(b.x, b.y, b.width, b.height);
        }

        for (let obs of obstacles) {
            ctx.save();
            if (obs.type === 2) {
                const alpha = Math.max(0.2, (Math.sin(obs.phase) + 1) / 2);
                ctx.globalAlpha = alpha;
            }

            if (obs.type === 0) {
                ctx.fillStyle = '#ff4d4d';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('+', obs.x + 10, obs.y + 22);
            } else if (obs.type === 1) {
                ctx.fillStyle = '#3399ff';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText('-', obs.x + 11, obs.y + 21);
            } else if (obs.type === 2) {
                ctx.fillStyle = '#a371f7';
                ctx.beginPath();
                ctx.arc(obs.x + 16, obs.y + 16, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText('⚛', obs.x + 10, obs.y + 21);
            } else if (obs.type === 3) {
                ctx.fillStyle = '#e3b341';
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText('?', obs.x + 12, obs.y + 21);
            }

            if (obs.hp < obs.maxHp) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(obs.x, obs.y - 8, obs.width, 4);
                ctx.fillStyle = '#3fb950';
                ctx.fillRect(obs.x, obs.y - 8, (obs.width * obs.hp) / obs.maxHp, 4);
            }
            ctx.restore();
        }

        if (bus.invincibleTimer % 4 < 2) {
            ctx.save();
            ctx.strokeStyle = bus.charge === 1 ? '#ff4d4d' : '#3399ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(bus.x + bus.width / 2, bus.y + bus.height / 2, 42, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#0052cc';
            ctx.fillRect(bus.x, bus.y, bus.width, bus.height);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(bus.x + 4, bus.y + 6, bus.width - 8, 16);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText('77', bus.x + 12, bus.y + 18);

            ctx.fillStyle = bus.charge === 1 ? '#ff4d4d' : '#3399ff';
            ctx.beginPath();
            ctx.arc(bus.x + bus.width / 2, bus.y + 45, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(bus.charge === 1 ? '+' : '-', bus.x + bus.width / 2 - 4, bus.y + 49);

            ctx.restore();
        }

        for (let p of particles) {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 4, 4);
        }

        ctx.fillStyle = 'rgba(13, 17, 23, 0.85)';
        ctx.fillRect(0, 0, canvas.width, 44);

        let hearts = '';
        for (let i = 0; i < bus.maxHp; i++) {
            hearts += i < bus.hp ? '💖' : '💔';
        }
        ctx.font = '14px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(hearts, 10, 26);

        ctx.fillStyle = '#58a6ff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(`${Math.floor(distance)}m (${speedMultiplier.toFixed(2)}x)`, 110, 26);

        const polColor = bus.charge === 1 ? '#ff4d4d' : '#3399ff';
        const polText = bus.charge === 1 ? '양전하 (+)' : '음전하 (-)';
        ctx.fillStyle = polColor;
        ctx.fillRect(canvas.width - 110, 10, 100, 24);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.fillText(`극성: ${polText}`, canvas.width - 104, 26);
    }
}

let currentQuiz = null;

function triggerQuiz() {
    gameState = 'QUIZ';
    currentQuiz = quizBank[Math.floor(Math.random() * quizBank.length)];
    
    document.getElementById('quiz-q').innerText = currentQuiz.q;
    const optsContainer = document.getElementById('quiz-opts');
    optsContainer.innerHTML = '';

    currentQuiz.opts.forEach((opt, idx) => {
        const btn = document.createElement('div');
        btn.className = 'quiz-opt-btn';
        btn.innerText = `${idx + 1}. ${opt}`;
        btn.onclick = () => selectQuizAnswer(idx);
        optsContainer.appendChild(btn);
    });

    document.getElementById('quiz-screen').classList.remove('hidden');
}

function selectQuizAnswer(idx) {
    document.getElementById('quiz-screen').classList.add('hidden');
    if (idx === currentQuiz.ans) {
        showRewardOptions();
    } else {
        alert("❌ 아쉽습니다! 정답이 아닙니다. (기본 운행 재개)");
        gameState = 'PLAYING';
    }
}

function showRewardOptions() {
    gameState = 'REWARD';
    const rewardContainer = document.getElementById('reward-options');
    rewardContainer.innerHTML = '';

    const rewards = [
        { title: "💖 체력 한계 증가 (+1 HP)", desc: "최대 체력이 1 증가하고 체력을 회복합니다.", apply: () => { bus.maxHp++; bus.hp = Math.min(bus.hp + 1, bus.maxHp); } },
        { title: "⚡ 플라즈마 파괴력 강화", desc: "장애물을 3대만 맞혀도 파괴 가능해집니다.", apply: () => { bus.attackDamage = 1.34; } },
        { title: "🔫 공격 속도 증가 (+20%)", desc: "플라즈마 캐논 발사 쿨다운이 감소합니다.", apply: () => { bus.maxCooldown = Math.max(6, Math.floor(bus.maxCooldown * 0.8)); } }
    ];

    rewards.forEach(r => {
        const card = document.createElement('div');
        card.className = 'reward-card';
        card.innerHTML = `<div class="reward-title">${r.title}</div><div class="reward-desc">${r.desc}</div>`;
        card.onclick = () => {
            r.apply();
            document.getElementById('reward-screen').classList.add('hidden');
            gameState = 'PLAYING';
        };
        rewardContainer.appendChild(card);
    });

    document.getElementById('reward-screen').classList.remove('hidden');
}

function gameOver() {
    gameState = 'GAMEOVER';
    saveScore(playerName, Math.floor(distance));
    document.getElementById('gameover-stats').innerText = `기사: ${playerName} | 주행거리: ${Math.floor(distance)}m | 점수: ${score}점`;
    renderLeaderboard('end-lb');
    document.getElementById('gameover-screen').classList.remove('hidden');
}

function saveScore(name, dist) {
    let lb = JSON.parse(localStorage.getItem('qbus77_lb') || '[]');
    lb.push({ name: name, dist: dist });
    lb.sort((a, b) => b.dist - a.dist);
    lb = lb.slice(0, 5);
    localStorage.setItem('qbus77_lb', JSON.stringify(lb));
}

function renderLeaderboard(elementId) {
    const container = document.getElementById(elementId);
    let lb = JSON.parse(localStorage.getItem('qbus77_lb') || '[]');
    if (lb.length === 0) {
        container.innerHTML = '<div class="lb-row"><span>등록된 순위가 없습니다.</span></div>';
        return;
    }
    let html = '';
    lb.forEach((row, i) => {
        html += `<div class="lb-row"><span>${i + 1}. ${row.name}</span><span>${row.dist}m</span></div>`;
    });
    container.innerHTML = html;
}

function startGame() {
    const inputName = document.getElementById('player-name').value.trim();
    if (inputName) playerName = inputName;
    document.getElementById('start-screen').classList.add('hidden');
    initGame();
    gameState = 'PLAYING';
}

function restartGame() {
    document.getElementById('gameover-screen').classList.add('hidden');
    initGame();
    gameState = 'PLAYING';
}

renderLeaderboard('start-lb');
requestAnimationFrame(gameLoop);
</script>
